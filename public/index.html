<!doctype html>
<html lang="id">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>ESP32 IoT Control</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <header>
 <h1>ESP32 IoT Control</h1>
 </header>
 <section id="login-view">
 <h2>Login</h2>
 <form id="login-form">
 <input id="email" type="email" placeholder="Email" required>
 <input id="password" type="password" placeholder="Password" required>
 <button type="submit">Login</button>
 <p id="login-error"></p>
 </form>
 </section>
 <section id="dashboard" hidden>
 <p>Login sebagai: <span id="user-email"></span></p>
 <button id="logout">Logout</button>
 <div class="grid">
 <article class="card">
 <h3>GPIO 12</h3>
 <button data-gpio="12" data-value="1">ON</button>
 <button data-gpio="12" data-value="0">OFF</button>
 <p>Status: <span id="state-12">OFF</span></p>
 </article>
 <article class="card">
 <h3>GPIO 13</h3>
 <button data-gpio="13" data-value="1">ON</button>
 <button data-gpio="13" data-value="0">OFF</button>
 <p>Status: <span id="state-13">OFF</span></p>
 </article>
 <article class="card">
 <h3>GPIO 14</h3>
 <button data-gpio="14" data-value="1">ON</button>
 <button data-gpio="14" data-value="0">OFF</button>
 <p>Status: <span id="state-14">OFF</span></p>
 </article>
 </div>
 </section>
 <script type="module" src="scripts/index.js"></script>
</body>
</html>
